[tool.poetry]
name = "ai-travel-operations-platform"
version = "0.1.0"
description = "Enterprise AI-assisted travel operations platform."
authors = ["Travel Operations Platform Team"]
readme = "README.md"
packages = [{ include = "travel_operations", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.115.6"
mangum = "^0.19.0"
pyjwt = "^2.10.1"
sqlalchemy = "^2.0.36"
sqlalchemy-cockroachdb = "^2.0.2"
psycopg = { version = "^3.2.3", extras = ["binary"] }
psycopg2-binary = "^2.9.10"
alembic = "^1.14.0"
boto3 = "^1.35.90"
pypdf = "^5.1.0"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
ruff = "^0.8.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
